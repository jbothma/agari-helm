url:
  hostname: "minio.local"

console:
  url:
    hostname: "minio-console.local"
  ingress:
    className: "nginx"

ingress:
  className: "nginx"
  hosts:
    - host: minio.local
      paths:
        - path: /
          pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/upstream-vhost: minio:9000
