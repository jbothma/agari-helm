name: Integration Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: "wget -q -O - https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash"

      - run: k3d cluster create agari --servers 1 --agents 1 --k3s-arg "--disable=traefik@server:0" --port "80:80@loadbalancer" --api-port 0.0.0.0:6550 --wait

      - name: Wait for K3s to be ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes

      - run: kubectl create namespace agari

      - name: Install nginx ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=300s

      - name: Configure /etc/hosts for hostname-based routing
        run: |
          echo "127.0.0.1 song.local
          127.0.0.1 score.local
          127.0.0.1 maestro.local
          127.0.0.1 arranger.local
          127.0.0.1 keycloak.local
          127.0.0.1 elasticsearch.local
          127.0.0.1 minio.local
          127.0.0.1 minio-console.local
          127.0.0.1 folio.local" | sudo tee -a /etc/hosts
          cat /etc/hosts

      - name: Install httpyac
        run: npm install -g httpyac

      - name: Deploy components
        run: ./test/deploy_test_env.sh

      - name: Run integration tests
        run: httpyac test/test.http --all --verbose

      - name: Show pod logs on failure
        if: failure()
        run: |
          echo "=== All Pods ==="
          kubectl get pods -A
          echo ""
          echo "=== Pod Descriptions (agari namespace) ==="
          kubectl describe pods -n agari
          echo ""
          echo "=== Recent Logs from All Agari Pods ==="
          for pod in $(kubectl get pods -n agari -o name 2>/dev/null); do
            echo "=== Logs for $pod ==="
            kubectl logs $pod -n agari --tail=100 || true
            echo ""
          done
          echo "=== Ingress Status ==="
          kubectl get ingress -A
          echo ""
          echo "=== Services (agari namespace) ==="
          kubectl get svc -n agari
          echo ""
          echo "=== Events (agari namespace) ==="
          kubectl get events -n agari --sort-by='.lastTimestamp'
