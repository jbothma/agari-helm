name: Integration Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - run: "wget -q -O - https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash"

      - run: k3d cluster create agari --servers 1 --agents 1 --k3s-arg "--disable=traefik@server:0" --port "80:80@loadbalancer" --api-port 0.0.0.0:6550 --wait

      - name: Wait for K3s to be ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes

      - run: kubectl create namespace agari

      - name: Install nginx ingress controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.1/deploy/static/provider/cloud/deploy.yaml
          kubectl wait --namespace ingress-nginx --for=condition=ready pod --selector=app.kubernetes.io/component=controller --timeout=300s

      - name: Configure /etc/hosts for hostname-based routing
        run: |
          echo "127.0.0.1 keycloak.local" | sudo tee -a /etc/hosts
          cat /etc/hosts

      - name: Deploy keycloak-db
        run: |
          echo "Deploying keycloak-db with dev environment overlay..."
          helm install keycloak-db ./helm/keycloak-db \
            -f ./helm/values/dev/keycloak.yaml \
            --wait \
            --timeout 5m

      - name: Verify keycloak-db deployment
        run: |
          kubectl get pods -l app.kubernetes.io/instance=keycloak-db --namespace=agari
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=keycloak-db --timeout=300s --namespace=agari

      - name: Deploy keycloak
        run: |
          echo "Deploying keycloak..."
          helm install keycloak ./helm/keycloak \
            -f ./helm/values/dev/keycloak.yaml \
            --wait \
            --timeout 10m

      - name: Verify keycloak deployment
        run: |
          kubectl get pods -l app.kubernetes.io/name=keycloak --namespace=agari
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=keycloak --timeout=600s --namespace=agari

      - name: Test authentication
        run: |
          echo "Testing Keycloak authentication as system-admin..."
          RESPONSE=$(curl --silent --request POST \
            --url http://keycloak.local/realms/agari/protocol/openid-connect/token \
            --header 'content-type: application/x-www-form-urlencoded' \
            --data username=system.admin@agari.tech \
            --data password=pass123 \
            --data grant_type=password \
            --data client_id=dms \
            --data client_secret=VDyLEjGR3xDQvoQlrHq5AB6OwbW0Refc)
          SYSADMIN_ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ "$SYSADMIN_ACCESS_TOKEN" = "null" ] || [ -z "$SYSADMIN_ACCESS_TOKEN" ]; then
            echo "Failed to get access token"
            echo "Response: $RESPONSE"
            exit 1
          fi
          echo "Successfully obtained access token for system-admin"
          echo "SYSADMIN_ACCESS_TOKEN=${SYSADMIN_ACCESS_TOKEN}" >> $GITHUB_ENV

      - name: Show pod logs on failure
        if: failure()
        run: |
          echo "=== Keycloak DB Logs ==="
          kubectl logs -l app.kubernetes.io/name=keycloak-db --tail=100 || true
          echo "=== Keycloak Logs ==="
          kubectl logs -l app.kubernetes.io/name=keycloak --namespace=agari --tail=100 || true
          echo "=== All Pods ==="
          kubectl get pods -A
          echo "=== Ingress Status ==="
          kubectl get ingress -A
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp'
